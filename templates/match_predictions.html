{% extends "base.html" %}
{% block content %}

<h2 style="
    text-align:center;
    margin-bottom:10px;
    font-size:22px;
">
    👀 {{home}} vs {{away}}
</h2>

{% if gl is not none %}
<div style="
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-bottom:24px;
">
    {{gl}} - {{gv}}
</div>
{% endif %}

{% for p in predictions %}

<div style="
    background:#1e3a8a;
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;
">

    <!-- izquierda -->
    <div style="
        display:flex;
        align-items:center;
        gap:10px;
        min-width:0;
    ">

        <img src="{{ p.avatar or '/static/img/default_m.png' }}"
             style="
                width:42px;
                height:42px;
                border-radius:50%;
                object-fit:cover;
             ">

        <div>

            <div style="
                font-weight:bold;
                font-size:15px;
                color:white;
            ">
                {{ p.user }}
            </div>

            <div style="
                font-size:12px;
                color:#cbd5f5;
                margin-top:2px;
            ">
                Pronóstico
            </div>

        </div>

    </div>

    <!-- derecha -->
    <div style="
        text-align:right;
    ">

        <div style="
            font-size:22px;
            font-weight:bold;
            color:white;
        ">
            {{ p.ph }} - {{ p.pv }}
        </div>

        <div style="
            font-size:13px;
            color:
            {% if p.points == 3 %}
                #22c55e
            {% elif p.points == 1 %}
                #facc15
            {% else %}
                #cbd5f5
            {% endif %};
            margin-top:2px;
            font-weight:bold;
        ">
            {{ p.points }} pts
        </div>

    </div>

</div>

{% endfor %}

{% endblock %}
