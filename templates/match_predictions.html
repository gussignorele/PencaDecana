{% extends "base.html" %}
{% block content %}

<h2 style="
    text-align:center;
    margin-bottom:6px;
    font-size:18px;
">
    👀 {{home}} vs {{away}}
</h2>

{% if gl is not none %}
<div style="
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:16px;
">
    {{gl}} - {{gv}}
</div>
{% endif %}

{% for p in predictions %}

<div style="
    background:#1e3a8a;
    border-radius:10px;
padding:4px 8px;
margin-bottom:4px;

    display:flex;
    align-items:center;
    justify-content:space-between;
">

    <!-- izquierda -->
    <div style="
        display:flex;
        align-items:center;
        gap:8px;
        min-width:0;
    ">

        <img src="{{ p.avatar or '/static/img/default_m.png' }}"
             style="
                width:34px;
                height:34px;
                border-radius:50%;
                object-fit:cover;
             ">

        <div style="
            font-weight:bold;
            font-size:11px;
            color:white;
        ">
            {{ p.user }}
        </div>

    </div>

    <!-- derecha -->
    <div style="
        display:flex;
        align-items:center;
        gap:12px;
    ">

        <div style="
            font-size:20px;
            font-weight:bold;
            color:white;
        ">
            {{ p.ph }} - {{ p.pv }}
        </div>

        <div style="
            width:32px;
            text-align:right;
            font-size:14px;
            font-weight:bold;

            color:
            {% if p.points == 3 %}
                #22c55e
            {% elif p.points == 1 %}
                #facc15
            {% else %}
                #cbd5f5
            {% endif %};
        ">
            {{ p.points }}
        </div>

    </div>

</div>

{% endfor %}

{% endblock %}
