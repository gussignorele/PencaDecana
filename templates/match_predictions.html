{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center; margin-bottom:20px;">
    👀 {{home}} vs {{away}}
</h2>

{% if gl is not none %}
<div style="
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
">
    {{gl}} - {{gv}}
</div>
{% endif %}

{% for p in predictions %}

<div style="
    background:#1e3a8a;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;
">

    <div style="display:flex; align-items:center; gap:10px;">

        <img src="{{ p.avatar or '/static/img/default_m.png' }}"
             style="
                width:38px;
                height:38px;
                border-radius:50%;
                object-fit:cover;
             ">

        <div style="font-weight:bold;">
            {{ p.user }}
        </div>

    </div>

    <div style="
        font-size:20px;
        font-weight:bold;
    ">
        {{ p.ph }} - {{ p.pv }}
    </div>

</div>

{% endfor %}

{% endblock %}
